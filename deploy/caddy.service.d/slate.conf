# Drop-in for the packaged caddy.service:
#
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo cp slate.conf /etc/systemd/system/caddy.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart caddy
#
# The Caddyfile reads its values from this environment file, and the private
# listener binds an address that may appear after Caddy starts — a VPN
# interface coming up late — so failing to bind is worth a retry.

[Unit]
StartLimitIntervalSec=0

[Service]
EnvironmentFile=/etc/slate.env
Restart=on-failure
RestartSec=5
